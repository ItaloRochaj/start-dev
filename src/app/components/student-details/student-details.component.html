<div class="details-container">
  <div class="details-header">
    <div class="back-link">
      <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Detalhes do Aluno</span>
    </div>
  </div>

  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>Carregando detalhes...</p>
  </div>

  <div *ngIf="student && !loading" class="details-content">
    <!-- Foto -->
    <div class="photo-section">
      <img
        [src]="photoUrl || getDefaultAvatar()"
        alt="Foto de {{ student.name }}"
        class="student-photo"
        (error)="onPhotoError($event)"
      >
    </div>

    <!-- Informações -->
    <div class="info-section">
      <!-- Nome Completo -->
      <div class="form-group">
        <label for="fullName" class="label">Nome Completo
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input
            id="fullName"
            type="text"
            [value]="student.name"
            disabled
            class="input-field"
          >
        </div>
      </div>

      <!-- CPF -->
      <div class="form-group">
        <label for="cpf" class="label">CPF
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="2" ry="2"></rect>
            <line x1="6" y1="8" x2="18" y2="8"></line>
            <line x1="6" y1="14" x2="18" y2="14"></line>
          </svg>
          <input
            id="cpf"
            type="text"
            [value]="student.cpf"
            disabled
            class="input-field"
          >
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="label">E-mail
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="M22 6l-10 5L2 6"></path>
          </svg>
          <input
            id="email"
            type="email"
            [value]="student.email"
            disabled
            class="input-field"
          >
        </div>
      </div>

      <!-- Telefone -->
      <div class="form-group">
        <label for="phone" class="label"> Telefone
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <input
            id="phone"
            type="tel"
            [value]="student.phone"
            disabled
            class="input-field"
          >
        </div>
      </div>

      <!-- Matrícula -->
      <div class="form-group">
        <label for="matricula" class="label">Matrícula
        </label>
        <div class="input-wrapper">
          <span class="input-icon" style="font-weight: bold; font-size: 18px;">#</span>
          <input
            id="matricula"
            type="text"
            [value]="matricula"
            disabled
            class="input-field"
          >
        </div>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label class="label">Status</label>
        <div class="status-display">
          <span [ngClass]="isActive ? 'status-dot active' : 'status-dot inactive'"></span>
          <span class="status-text">{{ isActive ? 'Ativo' : 'Inativo' }}</span>
        </div>
      </div>
    </div>

    <!-- Botão Voltar -->
    <div class="button-group">
      <button (click)="onCancel()" class="btn btn-secondary">Voltar</button>
    </div>
  </div>
</div>
