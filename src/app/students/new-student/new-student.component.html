<div class="edit-container">
  <!-- Header -->
  <div class="edit-header">
    <div class="back-link">
      <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Novo Aluno</span>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div class="loading-spinner" *ngIf="loading">
    <div class="spinner"></div>
    <p>Processando...</p>
  </div>

  <!-- Formulário -->
  <div *ngIf="!loading" class="edit-content">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Seção de Foto -->
      <div class="form-section">
        <h3>Foto do Aluno</h3>
        <div class="photo-section">
          <div class="photo-preview">
            <img
              [src]="photoPreview || getDefaultAvatar()"
              alt="Foto do aluno"
              (error)="onPhotoError($event)"
            >
            <div class="photo-actions">
              <button type="button" class="btn-photo" (click)="triggerFileInput()" title="Alterar Foto">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
              </button>
              <input
                type="file"
                id="photoInput"
                (change)="onFileSelected($event)"
                accept="image/*"
                hidden
              >
              <button
                type="button"
                class="btn-remove-photo"
                *ngIf="photoPreview"
                (click)="removePhoto()"
                title="Remover Foto"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Seção de Dados -->
      <div class="form-section">
        <h3>Dados do Aluno</h3>

        <!-- Nome Completo -->
        <div class="form-group">
          <label for="name" class="form-label">Nome Completo</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="name"
              formControlName="name"
              class="form-input"
              [class.is-invalid]="hasError('name')"
              placeholder="Digite o nome do aluno"
              maxlength="100"
            >
          </div>
          <span class="error-text" *ngIf="hasError('name')">
            {{ getErrorMessage('name') }}
          </span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">E-mail</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-input"
              [class.is-invalid]="hasError('email') || emailAlreadyExists"
              placeholder="aluno@email.com"
            >
            <span *ngIf="validatingEmail" class="validating-spinner">
              <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
            </span>
          </div>
          <span class="error-text" *ngIf="hasError('email')">
            {{ getErrorMessage('email') }}
          </span>
          <span class="error-text" *ngIf="emailAlreadyExists && !hasError('email')">
            Este Email já está cadastrado
          </span>
        </div>

        <!-- CPF -->
        <div class="form-group">
          <label for="cpf" class="form-label">CPF</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="cpf"
              formControlName="cpf"
              class="form-input"
              [class.is-invalid]="hasError('cpf') || cpfAlreadyExists"
              placeholder="000.000.000-00"
              (input)="formatCPF($event)"
            >
            <span *ngIf="validatingCpf" class="validating-spinner">
              <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
            </span>
          </div>
          <span class="error-text" *ngIf="hasError('cpf')">
            {{ getErrorMessage('cpf') }}
          </span>
          <span class="error-text" *ngIf="cpfAlreadyExists && !hasError('cpf')">
            Este CPF já está cadastrado
          </span>
        </div>

        <!-- Telefone -->
        <div class="form-group">
          <label for="phone" class="form-label">Telefone</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="phone"
              formControlName="phone"
              class="form-input"
              [class.is-invalid]="hasError('phone')"
              placeholder="(00) 00000-0000"
              (input)="formatPhone($event)"
            >
          </div>
          <span class="error-text" *ngIf="hasError('phone')">
            {{ getErrorMessage('phone') }}
          </span>
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="form-actions">
        <button
          type="button"
          class="btn-cancel"
          (click)="onCancel()"
          [disabled]="loading"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="btn-submit"
          [disabled]="form.invalid || loading || cpfAlreadyExists || emailAlreadyExists"
        >
          <span *ngIf="!loading">Cadastrar</span>
          <span *ngIf="loading">
            <svg class="btn-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            Processando...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
