<div class="container">
  <!-- Header com título -->
  <div class="header-form">
    <h2>Novo Aluno</h2>
  </div>

  <!-- Loading Spinner -->
  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>

  <!-- Formulário -->
  <div class="form-container" *ngIf="!loading">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Erro global -->
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Seção de Foto -->
      <div class="form-section">
        <h3>Foto do Aluno</h3>
        <div class="photo-section">
          <div class="photo-preview">
            <img *ngIf="photoPreview" [src]="photoPreview" alt="Foto do aluno">
            <img *ngIf="!photoPreview" src="assets/placeholder-photo.png" alt="Foto placeholder" class="placeholder">
          </div>
          <button type="button" class="btn-photo" (click)="triggerFileInput()">
            <span class="icon-camera">📷</span> Escolher Foto
          </button>
          <input
            type="file"
            id="photoInput"
            (change)="onFileSelected($event)"
            accept="image/*"
            hidden
          >
          <button
            type="button"
            class="btn-remove-photo"
            *ngIf="photoPreview"
            (click)="removePhoto()"
          >
            Remover
          </button>
        </div>
      </div>

      <!-- Seção de Dados -->
      <div class="form-section">
        <!-- Nome Completo -->
        <div class="form-group">
          <label for="name" class="form-label">Nome Completo</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="name"
              formControlName="name"
              class="form-input"
              [class.is-invalid]="hasError('name')"
              placeholder="Digite o nome do aluno"
              maxlength="100"
            >
          </div>
          <span class="error-text" *ngIf="hasError('name')">
            {{ getErrorMessage('name') }}
          </span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-input"
              [class.is-invalid]="hasError('email')"
              placeholder="aluno@email.com"
            >
          </div>
          <span class="error-text" *ngIf="hasError('email')">
            {{ getErrorMessage('email') }}
          </span>
        </div>

        <!-- CPF -->
        <div class="form-group">
          <label for="cpf" class="form-label">CPF</label>
          <div class="input-wrapper">
            <span class="input-icon">🆔</span>
            <input
              type="text"
              id="cpf"
              formControlName="cpf"
              class="form-input"
              [class.is-invalid]="hasError('cpf')"
              placeholder="000.000.000-00"
              (input)="formatCPF($event)"
            >
          </div>
          <span class="error-text" *ngIf="hasError('cpf')">
            {{ getErrorMessage('cpf') }}
          </span>
        </div>

        <!-- Telefone -->
        <div class="form-group">
          <label for="phone" class="form-label">Telefone</label>
          <div class="input-wrapper">
            <span class="input-icon">☎️</span>
            <input
              type="text"
              id="phone"
              formControlName="phone"
              class="form-input"
              [class.is-invalid]="hasError('phone')"
              placeholder="(00) 00000-0000"
              (input)="formatPhone($event)"
            >
          </div>
          <span class="error-text" *ngIf="hasError('phone')">
            {{ getErrorMessage('phone') }}
          </span>
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">
          Cancelar
        </button>
        <button
          type="submit"
          class="btn-submit"
          [disabled]="form.invalid || loading"
        >
          Cadastrar
        </button>
      </div>
    </form>
  </div>
</div>
