<div class="details-container">
  <div class="details-header">
    <div class="back-link">
      <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Detalhes do Aluno</span>
    </div>
  </div>

  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>Carregando detalhes...</p>
  </div>

  <div *ngIf="student && !loading" class="details-content">
    <!-- Foto -->
    <div class="photo-section">
      <img
        [src]="student.photo || getDefaultAvatar()"
        alt="Foto de {{ student.name }}"
        class="student-photo"
        (error)="onPhotoError($event)"
      >
    </div>

    <!-- Informações -->
    <div class="info-section">
      <!-- Nome Completo -->
      <div class="form-group">
        <label for="fullName" class="label">Nome Completo
        </label>
        <input
          id="fullName"
          type="text"
          [value]="student.name"
          disabled
          class="input-field"
        >
      </div>

      <!-- CPF -->
      <div class="form-group">
        <label for="cpf" class="label">CPF
        </label>
        <input
          id="cpf"
          type="text"
          [value]="student.cpf"
          disabled
          class="input-field"
        >
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="label">E-mail
        </label>
        <input
          id="email"
          type="email"
          [value]="student.email"
          disabled
          class="input-field"
        >
      </div>

      <!-- Telefone -->
      <div class="form-group">
        <label for="phone" class="label"> Telefone
        </label>
        <input
          id="phone"
          type="tel"
          [value]="student.phone"
          disabled
          class="input-field"
        >
      </div>

      <!-- Matrícula -->
      <div class="form-group">
        <label for="matricula" class="label">Matrícula
        </label>
        <input
          id="matricula"
          type="text"
          [value]="matricula"
          disabled
          class="input-field"
        >
      </div>

      <!-- Status -->
      <div class="form-group">
        <label class="label">Status</label>
        <div class="status-display">
          <span [ngClass]="isActive ? 'status-dot active' : 'status-dot inactive'"></span>
          <span class="status-text">{{ isActive ? 'Ativo' : 'Inativo' }}</span>
        </div>
      </div>
    </div>

    <!-- Botão Voltar -->
    <div class="button-group">
      <button (click)="onCancel()" class="btn btn-secondary">Voltar</button>
    </div>
  </div>
</div>
