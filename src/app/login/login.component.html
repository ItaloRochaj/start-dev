<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Start Students</h1>
    <p class="login-subtitle">Faça seu login para continuar</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Campo Usuário -->
      <div class="form-group">
        <label for="usuario" class="form-label">Usuário</label>
        <div class="input-wrapper">
          <img src="assets/user.png" alt="usuário" class="input-icon">
          <input
            type="text"
            id="usuario"
            formControlName="usuario"
            placeholder="usuario123"
            class="form-input"
            [class.input-error]="usuario?.invalid && usuario?.touched"
            [disabled]="isLoading"
          />
        </div>
        <div *ngIf="usuario?.invalid && usuario?.touched" class="error-message">
          <p *ngIf="usuario?.hasError('required')">Usuário é obrigatório</p>
          <p *ngIf="usuario?.hasError('usuarioInvalido')">
            Usuário deve ter no mínimo 8 caracteres, incluindo letras e números
          </p>
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="senha" class="form-label">Senha</label>
        <div class="input-wrapper">
          <img src="assets/cadeado.png" alt="senha" class="input-icon">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            id="senha"
            formControlName="senha"
            placeholder="••••••••"
            class="form-input"
            [class.input-error]="senha?.invalid && senha?.touched"
            [disabled]="isLoading"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
            [disabled]="isLoading"
            [title]="hidePassword ? 'Mostrar senha' : 'Ocultar senha'"
          >
            <svg *ngIf="hidePassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="!hidePassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div *ngIf="senha?.invalid && senha?.touched" class="error-message">
          <p *ngIf="senha?.hasError('required')">Senha é obrigatória</p>
          <p *ngIf="senha?.hasError('senhaInvalida')">
            Senha deve ter no mínimo 8 caracteres, incluindo letras e números
          </p>
        </div>
      </div>

      <!-- Botão Acessar -->
      <button
        type="submit"
        class="btn-acessar"
        [disabled]="isButtonDisabled()"
      >
        {{ isLoading ? 'Conectando...' : 'Acessar' }}
      </button>
    </form>
  </div>
</div>
